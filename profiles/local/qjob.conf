# A workstation/laptop without a scheduler. Set the native application path in
# ~/.config/qjob/<app>.conf; no program is installed by selecting this profile.
QJOB_SITE=local
run_local=1
nodes=1 cores=4 memory=8 time_limit=24
partition=''
storage=''
clean_tmp=success
QJOB_SCRATCH_ROOT=''
QJOB_MODULEPATH=''
QJOB_STORAGE_GRES=false
QJOB_SLURM_HINT=''
QJOB_MAX_NODES=1 QJOB_MAX_CORES=0 QJOB_MAX_MEMORY=0
