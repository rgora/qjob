# Private standalone OpenQP on WCSS. Site policy belongs here, not in the app.
cores=4 memory=8 time_limit=24
version=1.3.1
partition=lem-cpu-short
storage=shm:4g
clean_tmp=success
OPENQP_BINARY="$HOME/PD/opt/openqp/1.3.1/openqp"
OPENQP_MODE=openmp
OPENQP_MPI_AVAILABLE=false
OPENQP_BIND_ALLOCATION=false
QJOB_MODULE_INIT=''
QJOB_MODULEPATH=''
