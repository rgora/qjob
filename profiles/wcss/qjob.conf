# Explicit WCSS profile. Without site/user configuration these are also the
# legacy defaults, so existing individual installations keep working.
QJOB_SITE=WCSS
run_local=0
if id -nG 2>/dev/null | grep -qw plgrid; then partition=plgrid-lem-cpu; else partition=lem-cpu; fi
nodes=1
QJOB_SCRATCH_ROOT=''
QJOB_MODULEPATH=''
QJOB_STORAGE_GRES=true
QJOB_SLURM_HINT=''
QJOB_MAX_NODES=0 QJOB_MAX_CORES=0 QJOB_MAX_MEMORY=0
clean_tmp=false
